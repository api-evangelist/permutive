notes: >-
  An honest zero. Permutive's rate limits are real but are NOT published: both
  places the docs mention them, they redirect the reader to a human. The CCS
  API reference says "The CCS API is designed for high-throughput scenarios.
  Contact your Permutive representative for specific rate limit information for
  your workspace." The Contextual API reference says "Contact your Customer
  Success Manager for information about rate limits applicable to your
  account." A full-text search of the documentation corpus (via Permutive's own
  documentation MCP server) returns no other API rate-limit statement.
  No rate-limit RESPONSE HEADERS are documented anywhere, no 429 status is
  declared in any of the five Permutive-published OpenAPI documents, and the
  Contextual API's error table does not list 429 at all. An agent therefore has
  no runtime signal to back off on — it can only discover a limit by hitting it
  and receiving an undocumented status.
