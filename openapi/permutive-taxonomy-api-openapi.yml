openapi: 3.0.3
info:
  title: Taxonomy API
  version: v1
servers:
- url: https://api.permutive.app/audience-api/v1
paths:
  /imports:
    get:
      tags:
      - v1
      summary: Get all 2nd party data imports
      operationId: getImports
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WrappedResponse_Import_DataSource'
              example:
                items:
                - id: ef832310-b808-44f4-86bc-947be1cd37c7
                  name: Data Provider Name
                  code: data_provider_name
                  relation: 3rd
                  identifiers:
                  - appnexus
                  inheritance:
                    workspace_id: 5de2731c-8dcf-4e12-a815-e58b481bd8ac
                    relation: ancestor
                  source:
                    id: f93e5c65-7b2e-4c38-b721-3beb93e4f877
                    state:
                      type: active
                    type: live_ramp_3p
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpErrorResponse'
  /imports/{importId}:
    get:
      tags:
      - v1
      summary: Retrieves an import
      operationId: getImportsImportid
      parameters:
      - name: importId
        in: path
        description: Import ID
        required: true
        schema:
          type: string
          format: uuid
        example: 32f8e031-c532-41bb-b25e-65bdb677a96f
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Import_DataSource'
              example:
                id: ef832310-b808-44f4-86bc-947be1cd37c7
                name: Data Provider Name
                code: data_provider_name
                relation: 3rd
                identifiers:
                - appnexus
                inheritance:
                  workspace_id: 5de2731c-8dcf-4e12-a815-e58b481bd8ac
                  relation: ancestor
                source:
                  id: f93e5c65-7b2e-4c38-b721-3beb93e4f877
                  state:
                    type: active
                  type: live_ramp_3p
        '400':
          description: 'Invalid value for: path parameter importId'
          content:
            text/plain:
              schema:
                type: string
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpErrorResponse'
  /imports/{importId}/segments:
    get:
      tags:
      - v1
      summary: Get all segments for an import.
      description: Retrieves all segments for an import. This is a paginated endpoint and takes an optional
        pagination token as a query parameter. If no token is provided then it retrieves the first page
        of results.
      operationId: getImportsImportidSegments
      parameters:
      - name: importId
        in: path
        description: Import ID
        required: true
        schema:
          type: string
          format: uuid
        example: 32f8e031-c532-41bb-b25e-65bdb677a96f
      - name: pagination_token
        in: query
        description: Pagination Token
        required: false
        schema:
          type: string
        examples:
          '123':
            value: MTIzNA==
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_Segment'
              example:
                elements:
                - id: 1b890475-1482-496d-bcfd-6b2f5564b249
                  code: '1234'
                  name: Segment Name
                  import_id: 9f87bd3e-32eb-4d15-8e85-17fb275fa809
                  description: segment description
                  cpm: 2
                  categories:
                  - category_1
                  updated_at: '2023-04-12T11:27:00.716632Z'
                pagination:
                  next_token: MTIzNA==
                  total_count: 5
        '400':
          description: 'Invalid value for: path parameter importId, Invalid value for: query parameter
            pagination_token'
          content:
            text/plain:
              schema:
                type: string
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpErrorResponse'
    post:
      tags:
      - v1
      summary: Creates a segment for an import.
      operationId: postImportsImportidSegments
      parameters:
      - name: importId
        in: path
        description: Import ID
        required: true
        schema:
          type: string
          format: uuid
        example: 32f8e031-c532-41bb-b25e-65bdb677a96f
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SegmentCreate'
            example:
              name: segment
              code: '1234'
              description: segment description
              cpm: 2
              categories:
              - category1
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Segment'
        '400':
          description: 'Invalid value for: path parameter importId, Invalid value for: body'
          content:
            text/plain:
              schema:
                type: string
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpErrorResponse'
    patch:
      tags:
      - v1
      summary: Batch update operations.
      description: Note that operation order is not guaranteed. No more than 5,000 operations can be contained
        in a batch.
      operationId: patchImportsImportidSegments
      parameters:
      - name: importId
        in: path
        description: Import ID
        required: true
        schema:
          type: string
          format: uuid
        example: 32f8e031-c532-41bb-b25e-65bdb677a96f
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRequest'
            example:
              operations:
              - data:
                  name: segment
                  code: '1234'
                  description: segment description
                  cpm: 2
                  categories:
                  - category1
                operation: Create
              - code: '12345'
                operation: Delete
              - code: '1234'
                data:
                  name: segment
                  description: segment description
                  cpm: 2
                  categories:
                  - category1
                operation: Update
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WrappedResponse_Segment'
              example:
                items:
                - id: 1b890475-1482-496d-bcfd-6b2f5564b249
                  code: '1234'
                  name: Segment Name
                  import_id: 9f87bd3e-32eb-4d15-8e85-17fb275fa809
                  description: segment description
                  cpm: 2
                  categories:
                  - category_1
                  updated_at: '2023-04-12T11:27:00.716632Z'
        '400':
          description: 'Invalid value for: path parameter importId, Invalid value for: body'
          content:
            text/plain:
              schema:
                type: string
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpErrorResponse'
  /imports/{importId}/segments/{segmentId}:
    get:
      tags:
      - v1
      summary: Retrieves a single segment by its public ID for an import.
      description: Retrieves a single segment for a given import. The segment is identified by its globally
        unique public ID (UUID)
      operationId: getImportsImportidSegmentsSegmentid
      parameters:
      - name: importId
        in: path
        description: Import ID
        required: true
        schema:
          type: string
          format: uuid
        example: 32f8e031-c532-41bb-b25e-65bdb677a96f
      - name: segmentId
        in: path
        description: Segment ID
        required: true
        schema:
          type: string
          format: uuid
        example: 1b890475-1482-496d-bcfd-6b2f5564b249
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Segment'
              example:
                id: 1b890475-1482-496d-bcfd-6b2f5564b249
                code: '1234'
                name: Segment Name
                import_id: 9f87bd3e-32eb-4d15-8e85-17fb275fa809
                description: segment description
                cpm: 2
                categories:
                - category_1
                updated_at: '2023-04-12T11:27:00.716632Z'
        '400':
          description: 'Invalid value for: path parameter importId, Invalid value for: path parameter
            segmentId'
          content:
            text/plain:
              schema:
                type: string
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpErrorResponse'
    delete:
      tags:
      - v1
      summary: Deletes a segment by its code for an import
      description: Deletes a segment for an import. The segment is identified by its code.
      operationId: deleteImportsImportidSegmentsSegmentid
      parameters:
      - name: importId
        in: path
        description: Import ID
        required: true
        schema:
          type: string
          format: uuid
        example: 32f8e031-c532-41bb-b25e-65bdb677a96f
      - name: segmentId
        in: path
        description: Segment ID
        required: true
        schema:
          type: string
          format: uuid
        example: 1b890475-1482-496d-bcfd-6b2f5564b249
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Segment'
              example:
                id: 1b890475-1482-496d-bcfd-6b2f5564b249
                code: '1234'
                name: Segment Name
                import_id: 9f87bd3e-32eb-4d15-8e85-17fb275fa809
                description: segment description
                cpm: 2
                categories:
                - category_1
                updated_at: '2023-04-12T11:27:00.716632Z'
        '400':
          description: 'Invalid value for: path parameter importId, Invalid value for: path parameter
            segmentId'
          content:
            text/plain:
              schema:
                type: string
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpErrorResponse'
    patch:
      tags:
      - v1
      summary: Updates a segment by its public ID for an import
      description: Updates a segment for an import. The segment is identified by its globally unique public
        ID.
      operationId: patchImportsImportidSegmentsSegmentid
      parameters:
      - name: importId
        in: path
        description: Import ID
        required: true
        schema:
          type: string
          format: uuid
        example: 32f8e031-c532-41bb-b25e-65bdb677a96f
      - name: segmentId
        in: path
        description: Segment ID
        required: true
        schema:
          type: string
          format: uuid
        example: 1b890475-1482-496d-bcfd-6b2f5564b249
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SegmentUpdate'
            example:
              name: segment
              description: segment description
              cpm: 2
              categories:
              - category1
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Segment'
              example:
                id: 1b890475-1482-496d-bcfd-6b2f5564b249
                code: '1234'
                name: Segment Name
                import_id: 9f87bd3e-32eb-4d15-8e85-17fb275fa809
                description: segment description
                cpm: 2
                categories:
                - category_1
                updated_at: '2023-04-12T11:27:00.716632Z'
        '400':
          description: 'Invalid value for: path parameter importId, Invalid value for: path parameter
            segmentId, Invalid value for: body'
          content:
            text/plain:
              schema:
                type: string
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpErrorResponse'
