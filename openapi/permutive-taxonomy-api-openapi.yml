components:
  schemas:
    Active:
      type: object
    Active1:
      required:
      - bucket
      - permissions
      type: object
      properties:
        bucket:
          type: string
        permissions:
          $ref: '#/components/schemas/Permissions'
    AlreadyExists:
      type: object
      properties:
        c:
          type: string
        d:
          $ref: '#/components/schemas/JsonObject'
    Ancestor:
      required:
      - workspaceId
      type: object
      properties:
        workspaceId:
          type: string
          format: uuid
    AuthorizationFailed:
      type: object
      properties:
        c:
          type: string
        d:
          $ref: '#/components/schemas/JsonObject'
    AuthorizationFailedForAPIKey:
      type: object
      properties:
        c:
          type: string
        d:
          $ref: '#/components/schemas/JsonObject'
    AuthorizationFailedForUser:
      type: object
      properties:
        c:
          type: string
        d:
          $ref: '#/components/schemas/JsonObject'
    AuthorizationMissing:
      type: object
      properties:
        c:
          type: string
        d:
          $ref: '#/components/schemas/JsonObject'
    BadEncoding:
      type: object
      properties:
        c:
          type: string
        d:
          $ref: '#/components/schemas/JsonObject'
    BadOrigin:
      type: object
      properties:
        c:
          type: string
        d:
          $ref: '#/components/schemas/JsonObject'
    BatchOperation:
      oneOf:
      - $ref: '#/components/schemas/Create'
      - $ref: '#/components/schemas/Delete'
      - $ref: '#/components/schemas/Update'
    BatchRequest:
      required:
      - operations
      type: object
      properties:
        operations:
          required:
          - head
          type: object
          properties:
            head:
              $ref: '#/components/schemas/BatchOperation'
            tail:
              type: array
              items:
                $ref: '#/components/schemas/BatchOperation'
    Bespoke:
      type: object
    Create:
      required:
      - data
      type: object
      properties:
        data:
          $ref: '#/components/schemas/SegmentCreate'
    Creating:
      type: object
    Creating1:
      required:
      - permissions
      type: object
      properties:
        permissions:
          $ref: '#/components/schemas/Permissions'
    DataSource:
      oneOf:
      - $ref: '#/components/schemas/Active1'
      - $ref: '#/components/schemas/Bespoke'
      - $ref: '#/components/schemas/Creating1'
      - $ref: '#/components/schemas/LiveRamp3P'
      - $ref: '#/components/schemas/PrincipalError'
      - $ref: '#/components/schemas/RealtimeAPI'
      - $ref: '#/components/schemas/SetupFailure'
      - $ref: '#/components/schemas/Updating1'
      - $ref: '#/components/schemas/V1'
      - $ref: '#/components/schemas/V11'
    Delete:
      required:
      - code
      type: object
      properties:
        code:
          type: string
    Details_DataSource:
      required:
      - id
      - state
      - details
      type: object
      properties:
        id:
          type: string
          format: uuid
        state:
          $ref: '#/components/schemas/State'
        details:
          $ref: '#/components/schemas/DataSource'
    DoesNotExist:
      type: object
      properties:
        c:
          type: string
        d:
          $ref: '#/components/schemas/JsonObject'
    Error:
      required:
      - errors
      type: object
      properties:
        errors:
          $ref: '#/components/schemas/NonEmptyList_String'
    Failure:
      type: object
    Group:
      required:
      - id
      type: object
      properties:
        id:
          type: string
    HttpError:
      oneOf:
      - $ref: '#/components/schemas/AlreadyExists'
      - $ref: '#/components/schemas/AuthorizationFailed'
      - $ref: '#/components/schemas/AuthorizationFailedForAPIKey'
      - $ref: '#/components/schemas/AuthorizationFailedForUser'
      - $ref: '#/components/schemas/AuthorizationMissing'
      - $ref: '#/components/schemas/BadEncoding'
      - $ref: '#/components/schemas/BadOrigin'
      - $ref: '#/components/schemas/DoesNotExist'
      - $ref: '#/components/schemas/InsufficientAPIKey'
      - $ref: '#/components/schemas/InvalidAPIKey'
      - $ref: '#/components/schemas/InvalidHeader'
      - $ref: '#/components/schemas/InvalidParameters'
      - $ref: '#/components/schemas/InvalidRequestBody'
      - $ref: '#/components/schemas/MissingHeader'
      - $ref: '#/components/schemas/MissingOrigin'
      - $ref: '#/components/schemas/MissingParameters'
      - $ref: '#/components/schemas/MissingRequestBody'
      - $ref: '#/components/schemas/RouteDeprecated'
      - $ref: '#/components/schemas/SchemeNotSupported'
      - $ref: '#/components/schemas/UnknownError'
      - $ref: '#/components/schemas/UnspecifiedInternalError'
      - $ref: '#/components/schemas/ValidationError'
      - $ref: '#/components/schemas/VerbNotImplemented'
    HttpErrorResponse:
      required:
      - requestId
      - error
      type: object
      properties:
        requestId:
          type: string
          format: uuid
        error:
          $ref: '#/components/schemas/HttpError'
    HttpStatus:
      required:
      - code
      type: object
      properties:
        code:
          type: integer
          format: int32
    Import_DataSource:
      required:
      - id
      - name
      - code
      - relation
      - identifiers
      - source
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        code:
          type: string
        relation:
          $ref: '#/components/schemas/Relation'
        identifiers:
          $ref: '#/components/schemas/NonEmptyList_Identifier'
        inheritance:
          $ref: '#/components/schemas/Inheritance'
        source:
          $ref: '#/components/schemas/Details_DataSource'
    Inheritance:
      oneOf:
      - $ref: '#/components/schemas/Ancestor'
    InsufficientAPIKey:
      type: object
      properties:
        c:
          type: string
        d:
          $ref: '#/components/schemas/JsonObject'
    InvalidAPIKey:
      type: object
      properties:
        c:
          type: string
        d:
          $ref: '#/components/schemas/JsonObject'
    InvalidHeader:
      type: object
      properties:
        c:
          type: string
        d:
          $ref: '#/components/schemas/JsonObject'
    InvalidParameters:
      type: object
      properties:
        c:
          type: string
        d:
          $ref: '#/components/schemas/JsonObject'
    InvalidRequestBody:
      type: object
      properties:
        c:
          type: string
        d:
          $ref: '#/components/schemas/JsonObject'
    JsonObject:
      type: object
    LiveRamp3P:
      type: object
    MissingHeader:
      type: object
      properties:
        c:
          type: string
        d:
          $ref: '#/components/schemas/JsonObject'
    MissingOrigin:
      type: object
      properties:
        c:
          type: string
        d:
          $ref: '#/components/schemas/JsonObject'
    MissingParameters:
      type: object
      properties:
        c:
          type: string
        d:
          $ref: '#/components/schemas/JsonObject'
    MissingRequestBody:
      type: object
      properties:
        c:
          type: string
        d:
          $ref: '#/components/schemas/JsonObject'
    NonEmptyList_Identifier:
      required:
      - head
      type: object
      properties:
        head:
          type: string
        tail:
          type: array
          items:
            type: string
    NonEmptyList_String:
      required:
      - head
      type: object
      properties:
        head:
          type: string
        tail:
          type: array
          items:
            type: string
    PaginatedResponse_Segment:
      required:
      - pagination
      type: object
      properties:
        elements:
          type: array
          items:
            $ref: '#/components/schemas/Segment'
        pagination:
          $ref: '#/components/schemas/Pagination'
    Pagination:
      type: object
      properties:
        nextToken:
          $ref: '#/components/schemas/PaginationToken'
        totalCount:
          $ref: '#/components/schemas/PaginationCount'
    PaginationCount:
      required:
      - value
      type: object
