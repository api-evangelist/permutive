standards:
- id: openapi-3
  conforms: true
  evidence: >-
    Permutive publishes five OpenAPI documents (3.0.1 Cohorts, 3.0.3 Taxonomy,
    3.1.0 Identity, 3.1.0 Events, 3.1.0 Segmentation), all with servers[],
    operationIds, tagged operations, request/response schemas and examples.
  note: 'Version drift across the set: three different OpenAPI versions for one platform.'
- id: oauth2
  conforms: false
  evidence: 'The product API authenticates with workspace API keys (X-API-Key header or `k` query parameter). No OAuth2 scheme appears in any spec.'
  caveat: >-
    permutive.com serves RFC 8414 OAuth authorization-server metadata, but that
    belongs to an MCP plugin on the WordPress marketing site, not to the
    product API. See well-known/permutive-well-known.yml.
- id: openid-connect
  conforms: partial
  evidence: >-
    OIDC is supported for HUMAN console login to the Permutive platform (SSO via
    SAML and OpenID Connect with MFA enforced by the customer IdP), per
    https://docs.permutive.com/governance/security. It is not available for API
    authentication.
- id: rfc8414-oauth-authorization-server-metadata
  conforms: partial
  evidence: 'Served at https://permutive.com/.well-known/oauth-authorization-server — for the WordPress MCP plugin only.'
- id: rfc9728-oauth-protected-resource-metadata
  conforms: partial
  evidence: 'Served at https://permutive.com/.well-known/oauth-protected-resource — for the WordPress MCP plugin only.'
- id: rfc9457-problem-details
  conforms: false
  evidence: >-
    Permutive publishes a custom error envelope {request_id, error{status, code,
    message, cause?, docs}} with content-type application/json. No
    application/problem+json anywhere, no `type`/`title`/`detail`/`instance`
    members.
- id: rfc9116-security-txt
  conforms: false
  evidence: 'No security.txt served on permutive.com, api.permutive.com or docs.permutive.com (all 404).'
- id: rfc8594-sunset-header
  conforms: false
  evidence: 'No Sunset or Deprecation header support and no deprecation policy published.'
- id: rfc9110-rate-limit-headers
  conforms: false
  evidence: 'No rate-limit response headers documented; no 429 declared in any spec.'
- id: model-context-protocol
  conforms: true
  evidence: >-
    A live MCP server at https://docs.permutive.com/mcp answers JSON-RPC 2.0
