aid: permutive
name: Permutive
description: >-
  Permutive is a predictive data collaboration and activation platform for
  premium publishers, advertisers and agencies. Its platform spans a Data
  Management Platform, a Data Clean Room for privacy-safe collaboration with
  150+ premium publishers, AI-curated audiences, and the Halo agentic suite that
  scales direct buying. The developer platform exposes six REST APIs — Events,
  Identity, Contextual, Custom Cohort Segmentation, Cohorts and Taxonomy — plus
  web, mobile and CTV SDKs, an anonymous documentation Model Context Protocol
  server, and an invitation-only audience-intelligence MCP server that makes
  cohort discovery, reach measurement and audience comparison available to AI
  agents. Authentication is a workspace-scoped API key; every call is bounded by
  the workspace that owns the key.
