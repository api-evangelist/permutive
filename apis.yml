apis:
- aid: permutive:permutive-contextual-api
  name: Permutive Contextual API
  description: >-
    Retrieve contextual cohort targeting values for a page URL without processing any user data, for ad-server
    integration. Returns cohort codes, per-destination activation mappings and content classifications
    (categories, keywords, entities, sentiment, emotion, concepts) against IAB 2.0/2.2/3.0 or custom taxonomies.
    Safe to call for unconsented users.
  humanURL: https://docs.permutive.com/api/contextual/introduction
  baseURL: https://api.permutive.com/ctx/v1
  tags:
  - Contextual
  - Advertising
  properties:
  - type: OpenAPI
    url: openapi/permutive-contextual-api-openapi.yml
- aid: permutive:permutive-mcp
  name: Permutive MCP Server
  description: >-
    Permutive's Model Context Protocol surface. A live, anonymous documentation MCP server at https://docs.permutive.com/mcp
    (search, virtual-filesystem query, feedback), plus an invitation-only audience-intelligence MCP server
    exposing ten read-only tools over workspaces, Google Ad Manager campaigns, cohorts and audience analysis
    (measure, compare, extend).
  humanURL: https://docs.permutive.com/api/mcp/introduction
  baseURL: https://docs.permutive.com/mcp
