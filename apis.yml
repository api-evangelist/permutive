aid: permutive
name: Permutive
description: >-
  Permutive is an agentic data collaboration and activation platform for premium
  publishers, advertisers and agencies. Its platform spans a Data Management
  Platform, a Data Clean Room for privacy-safe collaboration with 150+ premium
  publishers, AI-curated audiences, and the Halo agentic suite that scales direct
  buying. The developer platform exposes REST APIs for event tracking, identity,
  audience cohort management, contextual segmentation and second-party data
  imports, plus web, mobile and CTV SDKs and an official Model Context Protocol
  (MCP) server that makes audience intelligence available to AI agents.
