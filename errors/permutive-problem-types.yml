divergences:
- 'Taxonomy API 400s are text/plain, not the documented JSON envelope.'
- 'Taxonomy API models all non-200 outcomes other than 400 as a single `default` response rather than enumerating statuses.'
- 'No 429 is declared by ANY Permutive spec, and the Contextual API error table omits it, despite rate limits existing per workspace.'
- 'The Contextual API documents only 200/400/401/500 — no 403, no 404.'

