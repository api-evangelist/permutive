notes: >-
  First-party Permutive client libraries. Every entry below now carries a
  structured `version` and `published` date read from the registry that
  distributes it (registry.npmjs.org for npm, the GitHub tags/releases API for
  the Swift Package Manager repositories), rather than being buried in prose.
  THE HEADLINE FINDING IS A DISTRIBUTION GAP. Permutive's most-deployed client
  by far — the JavaScript SDK, which every publisher on the platform loads on
  every page — is NOT published to any package registry. It is served from a
  per-tenant CDN path (`https://<ORGANIZATION_ID>.edge.permutive.app/<WORKSPACE_ID>-web.js`)
  with NO version pinning anywhere in the URL, so a consumer cannot state which
  version they are running, cannot pin one, and cannot diff two. The docs say
  so themselves: "Current Version: See your Permutive dashboard for the latest
  version." Its release notes are published without version headings or dates.
  That is recorded as `version: null` with `registry: cdn` and an explicit
  note — checked, nothing pinnable to record.
  The Android SDK is likewise not on Maven Central or any public Maven
  repository under a Permutive coordinate; only a demo repository is public.

