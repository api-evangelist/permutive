notes: >-
  Permutive publishes dated release notes for its SDKs, not for its APIs. There
  is no API changelog: the Events, Identity, Cohorts, Taxonomy, Segmentation
  and Contextual APIs have no dated change record anywhere on the developer
  site, so a consumer of the REST surface has no way to see what changed and
  when. The iOS and Android release notes below are month-dated and structured;
  the JavaScript SDK notes are a Keep-a-Changelog dump of commit subjects with
  no version headings and no dates, so its recent entries cannot be dated
  honestly and are recorded as an undated highlight list.
