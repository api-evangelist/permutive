overlay: 1.0.0
info:
  title: API Evangelist enhancements for Permutive API
  version: 1.0.0
extends: openapi/permutive-openapi.yml
actions:
  - target: $.info
    update:
      x-apievangelist-rating: 3
      x-apievangelist-review: https://apis.io/permutive
      x-apievangelist-mcp: https://developer.permutive.com/api/mcp/introduction
  - target: $.tags
    update:
      - name: Events
        x-product: Connectivity
      - name: Cohorts
        x-product: Signals
      - name: Taxonomy
        x-product: Connectivity
  - target: "$.paths['/v2/cohorts']"
    update:
      x-apievangelist-note: Cohort management is also exposed to agents via the Permutive MCP server (search_cohorts, list_cohorts, get_cohort_detail).
